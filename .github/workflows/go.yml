name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: make check-sql
      - name: Strict Go lint and race tests
        run: make check
      - run: make build
      - run:
          bin/knotra validate examples/showcase/release-gate/pipeline.yaml --profile
          examples/local/profile.yaml

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: knotra-ci
      KNOTRA_TEST_DATABASE_URL: postgres://knotra:knotra-development@127.0.0.1:25432/knotra?sslmode=disable
      KNOTRA_TEST_FIREWALL_IMAGE: knotra-firewall:dev
      KNOTRA_TEST_RECOVERY: '1'
      KNOTRA_TEST_RUNTIME_RECOVERY: '1'
      KNOTRA_TEST_POSTGRES_CONTAINER: knotra-ci-postgres-1
      KNOTRA_TEST_TEMPORAL: 127.0.0.1:27233
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose --profile temporal up -d --wait --wait-timeout 120
      - run: make helper firewall
      - run: docker pull python:3.13-alpine
      - name: PostgreSQL, HTTP, Docker and MCP integration
        run: |
          export KNOTRA_TEST_HELPER="$PWD/.knotra/bin/sandbox-helper"
          export KNOTRA_TEST_WORKDIR="$PWD/.knotra/test-work"
          go test -p 1 -race -count=1 -timeout=20m ./internal/store ./internal/api ./internal/executor ./internal/queue ./internal/scheduler ./internal/adapters/... ./internal/integration
      - name: Infrastructure logs
        if: failure()
        run: docker compose --profile temporal logs --no-color --tail=100
      - name: Clean up test infrastructure
        if: always()
        run: docker compose --profile temporal down --volumes
