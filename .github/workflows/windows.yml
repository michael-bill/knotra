name: Windows CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify strict lint configuration
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 config verify
      - name: Strict Go lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...
      - run: go build -mod=readonly -trimpath -o bin/knotra.exe ./cmd/knotra
      - run: .\bin\knotra.exe --help
      - run:
          .\bin\knotra.exe validate examples/showcase/release-gate/pipeline.yaml --profile
          examples/local/profile.yaml
