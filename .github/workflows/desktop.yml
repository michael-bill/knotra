name: Desktop and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global bun@1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .. --ignore-path ../.prettierignore
      - run: bun run test
      - run: bun run build
      - if: github.event_name == 'workflow_dispatch'
        run: bunx playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch'
        run: bun run test:e2e

  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml

  engine-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: knotra-desktop-ci
      KNOTRA_TEST_DESKTOP: '1'
      KNOTRA_TEST_DATABASE_URL: postgres://knotra:knotra-development@127.0.0.1:25432/knotra?sslmode=disable
      KNOTRA_TEST_TEMPORAL: 127.0.0.1:27233
      KNOTRA_TEST_FIREWALL_IMAGE: knotra-firewall:dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install --global bun@1.3.10
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run build
        working-directory: app
      - run: bunx playwright install --with-deps chromium
        working-directory: app
      - run: rustup show
      - name: Compile native acceptance before its runtime deadline
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml --no-run
      - run: docker compose --profile temporal up -d --wait --wait-timeout 120
      - run: make helper firewall
      - run: docker pull python:3.13-alpine
      - name: Native and browser clients against Temporal and River
        run: |
          export KNOTRA_TEST_HELPER="$PWD/.knotra/bin/sandbox-helper"
          go test -mod=readonly -race -count=1 -timeout=15m ./internal/integration -run '^TestDesktopLiteralBackendCompatibility$' -v
      - name: Acceptance and infrastructure logs
        if: failure()
        run: |
          docker compose --profile temporal logs --no-color --tail=100
          if test -d .knotra/integration-work; then
            rg --files --hidden --no-ignore .knotra/integration-work -g '*.log' -g error-context.md | xargs -r tail -n 100
          fi
      - name: Clean up test infrastructure
        if: always()
        run: docker compose --profile temporal down --volumes

  contract-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m venv /tmp/knotra-contract-venv
      - run:
          /tmp/knotra-contract-venv/bin/pip install -r scripts/requirements-contract.txt
          black==25.1.0
      - run:
          /tmp/knotra-contract-venv/bin/black --check scripts examples/integration examples/starter
          examples/showcase
      - run: /tmp/knotra-contract-venv/bin/python scripts/check_contract.py
      - run:
          PYTHONDONTWRITEBYTECODE=1 /tmp/knotra-contract-venv/bin/python
          examples/starter/research_test.py
      - run:
          PYTHONDONTWRITEBYTECODE=1 /tmp/knotra-contract-venv/bin/python -m unittest discover -s
          examples/showcase/portfolio-review/tests -v
      - run:
          PYTHONDONTWRITEBYTECODE=1 /tmp/knotra-contract-venv/bin/python -m unittest discover -s
          examples/showcase/release-gate/tests -v
