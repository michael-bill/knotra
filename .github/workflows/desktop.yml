name: Desktop and documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global bun@1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .. --ignore-path ../.prettierignore
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml

  contract-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m venv /tmp/knotra-contract-venv
      - run:
          /tmp/knotra-contract-venv/bin/pip install -r scripts/requirements-contract.txt
          black==25.1.0
      - run:
          /tmp/knotra-contract-venv/bin/black --check scripts examples/integration examples/starter
          examples/showcase
      - run: /tmp/knotra-contract-venv/bin/python scripts/check_contract.py
      - run:
          PYTHONDONTWRITEBYTECODE=1 /tmp/knotra-contract-venv/bin/python
          examples/starter/research_test.py
      - run:
          PYTHONDONTWRITEBYTECODE=1 /tmp/knotra-contract-venv/bin/python -m unittest discover -s
          examples/showcase/portfolio-review/tests -v
      - run:
          PYTHONDONTWRITEBYTECODE=1 /tmp/knotra-contract-venv/bin/python -m unittest discover -s
          examples/showcase/release-gate/tests -v
