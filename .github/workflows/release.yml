name: CLI release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - name: Build CLI bundles and Linux helpers
        run: scripts/package-release.sh "${GITHUB_REF_NAME}" bin/releases
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/releases/*.tar.gz bin/releases/SHA256SUMS \
            --title "Knotra $GITHUB_REF_NAME" --generate-notes
