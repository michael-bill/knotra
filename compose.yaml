name: knotra

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: knotra
      POSTGRES_USER: knotra
      POSTGRES_PASSWORD: ${KNOTRA_DEV_DB_PASSWORD:-knotra-development}
    ports:
      - '127.0.0.1:${KNOTRA_PG_PORT:-25432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U knotra -d knotra']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 128

  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --ui-disable-news-fetch
    ports:
      - '127.0.0.1:${KNOTRA_TEMPORAL_PORT:-27233}:7233'
      - '127.0.0.1:${KNOTRA_TEMPORAL_UI_PORT:-28233}:8233'
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, '127.0.0.1:7233']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 2g
    pids_limit: 512

volumes:
  postgres-data:
  temporal-data:
