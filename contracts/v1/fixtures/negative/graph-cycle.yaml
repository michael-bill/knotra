apiVersion: knotra/v1
kind: Pipeline
metadata:
  name: basic-human
spec:
  nodes:
    ask:
      type: human
      human:
        prompt:
          text: Return the requested value.
      outputs:
        answer:
          schema:
            type: string
      needs:
        - other
    other:
      type: human
      human:
        prompt:
          text: Return the requested value.
      outputs:
        answer:
          schema:
            type: string
      needs:
        - ask
  outputs:
    answer:
      schema:
        type: string
      bind:
        from: nodes.ask.outputs.answer
