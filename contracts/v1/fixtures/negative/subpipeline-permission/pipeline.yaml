apiVersion: knotra/v1
kind: Pipeline
metadata:
  name: subpipeline-contract
spec:
  files:
    - children/writer.yaml
  inputs:
    question:
      schema:
        type: string
      default: Describe the contract.
  nodes:
    invoke:
      type: pipeline
      inputs:
        question:
          schema:
            type: string
          bind:
            from: inputs.question
      pipeline:
        file: children/writer.yaml
        permissions:
          models:
            - child_writer
          mcp: {}
          sandboxes: []
          secrets: []
  outputs:
    reply:
      schema:
        type: string
      bind:
        from: nodes.invoke.outputs.reply
