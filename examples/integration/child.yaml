apiVersion: knotra/v1
kind: Pipeline
metadata:
  name: bundle-report
spec:
  sandboxes:
    python: {profile: python}
  inputs:
    marker: {schema: {type: string}}
    report: {artifact: {mediaTypes: [text/markdown]}}
    doubled: {schema: {type: array, items: {type: integer}}}
    iterations: {schema: {type: integer}}
    approved: {schema: {type: boolean}}
  nodes:
    assemble:
      type: code
      sandbox: python
      inputs:
        marker: {schema: {type: string}, bind: {from: inputs.marker}}
        report:
          artifact: {mediaTypes: [text/markdown]}
          mount: incoming/report.md
          bind: {from: inputs.report}
        doubled:
          schema: {type: array, items: {type: integer}}
          bind: {from: inputs.doubled}
        iterations:
          schema: {type: integer}
          bind: {from: inputs.iterations}
        approved:
          schema: {type: boolean}
          bind: {from: inputs.approved}
      code: {command: [python, /package/worker.py, bundle]}
      outputs:
        total: {schema: {type: integer}}
        report:
          artifact: {mediaTypes: [text/markdown]}
          collect: {path: final.md, mediaType: text/markdown}
  outputs:
    total: {schema: {type: integer}, bind: {from: nodes.assemble.outputs.total}}
    report:
      artifact: {mediaTypes: [text/markdown]}
      bind: {from: nodes.assemble.outputs.report}
