# Generated service lanes; scripts/build_pipeline.py supports another service inventory.
apiVersion: knotra/v1
kind: Pipeline
metadata:
  name: service-fleet-release
  title: Service fleet release gate
  description:
    Execute release checks in isolated sandboxes, verify agent citations and authorize an immutable
    evidence packet.
spec:
  files:
    - scripts/gate.py
    - release-policy.md
    - schemas/review.json
  schemas:
    review:
      file: schemas/review.json
  models:
    reviewer:
      connection: model_main
      requires:
        - toolCalling
  sandboxes:
    checks:
      profile: python_box
  limits:
    timeout: 30m
    maxConcurrentNodes: 6
    maxNodeInstances: 256
    maxModelCalls: 30
    maxToolCalls: 60
  inputs:
    repository:
      artifact:
        mediaTypes:
          - application/zip
  nodes:
    freeze_snapshot:
      type: code
      description: Validate archive paths and freeze the exact release inventory.
      sandbox: checks
      inputs:
        repository:
          artifact:
            mediaTypes:
              - application/zip
          bind:
            from: inputs.repository
          mount: incoming/repository.zip
        expected_services:
          schema:
            type: array
            items:
              type: string
              minLength: 1
          bind:
            value:
              - orders
              - billing
              - identity
              - inventory
              - notifications
              - search
      code:
        command:
          - python3
          - /package/scripts/gate.py
          - prepare
      outputs:
        inventory:
          schema:
            type: object
        repository:
          artifact:
            mediaTypes:
              - application/zip
          collect:
            path: repository.zip
            mediaType: application/zip
        inventory_file:
          artifact:
            mediaTypes:
              - application/json
          collect:
            path: inventory.json
            mediaType: application/json
    orders_tests:
      type: code
      description: Execute tests checks for orders against the frozen repository.
      sandbox: checks
      inputs:
        repository:
          artifact:
            mediaTypes:
              - application/zip
          bind:
            from: nodes.freeze_snapshot.outputs.repository
          mount: incoming/repository.zip
        service:
          schema:
            type: string
            minLength: 1
          bind:
            value: orders
        kind:
          schema:
            type: string
            minLength: 1
          bind:
            value: tests
      code:
        command:
          - python3
          - /package/scripts/gate.py
          - check
      outputs:
        report:
          schema:
            type: object
        evidence_file:
          artifact:
            mediaTypes:
              - application/json
          collect:
            path: check.json
            mediaType: application/json
    orders_api:
      type: code
      description: Execute api checks for orders against the frozen repository.
      sandbox: checks
      inputs:
        repository:
          artifact:
            mediaTypes:
              - application/zip
          bind:
            from: nodes.freeze_snapshot.outputs.repository
          mount: incoming/repository.zip
        service:
          schema:
            type: string
            minLength: 1
          bind:
            value: orders
        kind:
          schema:
            type: string
            minLength: 1
          bind:
            value: api
        previous:
          schema:
            type: object
          bind:
            from: nodes.orders_tests.outputs.report
      code:
        command:
          - python3
          - /package/scripts/gate.py
          - check
      outputs:
        report:
          schema:
            type: object
        evidence_file:
          artifact:
            mediaTypes:
              - application/json
          collect:
            path: check.json
            mediaType: application/json
    orders_deployment:
      type: code
      description: Execute deployment checks for orders against the frozen repository.
